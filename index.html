<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéDex - Explora el Mundo Pokémon</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">
                <span class="pokeball-icon">⚪</span>
                PokéDex
            </h1>
            <p class="subtitle">Descubre y explora todos los Pokémon</p>
        </header>

        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Buscar Pokémon por nombre o número..."
                    autocomplete="off"
                >
                <button id="searchBtn" class="search-btn">🔍</button>
            </div>
            
            <div class="filter-container">
                <label for="typeFilter">Tipo:</label>
                <select id="typeFilter" class="type-filter">
                    <option value="">Todos los tipos</option>
                    <option value="normal">Normal</option>
                    <option value="fire">Fuego</option>
                    <option value="water">Agua</option>
                    <option value="electric">Eléctrico</option>
                    <option value="grass">Planta</option>
                    <option value="ice">Hielo</option>
                    <option value="fighting">Lucha</option>
                    <option value="poison">Veneno</option>
                    <option value="ground">Tierra</option>
                    <option value="flying">Volador</option>
                    <option value="psychic">Psíquico</option>
                    <option value="bug">Bicho</option>
                    <option value="rock">Roca</option>
                    <option value="ghost">Fantasma</option>
                    <option value="dragon">Dragón</option>
                    <option value="dark">Siniestro</option>
                    <option value="steel">Acero</option>
                    <option value="fairy">Hada</option>
                </select>
                
                <label for="generationFilter">Generación:</label>
                <select id="generationFilter" class="generation-filter">
                    <option value="">Todas</option>
                    <option value="1">Gen I (1-151)</option>
                    <option value="2">Gen II (152-251)</option>
                    <option value="3">Gen III (252-386)</option>
                    <option value="4">Gen IV (387-493)</option>
                    <option value="5">Gen V (494-649)</option>
                    <option value="6">Gen VI (650-721)</option>
                    <option value="7">Gen VII (722-809)</option>
                    <option value="8">Gen VIII (810-905)</option>
                    <option value="9">Gen IX (906-1025)</option>
                </select>
            </div>
        </div>

        <div id="loadingSpinner" class="loading-spinner hidden">
            <div class="pokeball-spinner"></div>
            <p>Cargando Pokémon...</p>
        </div>

        <div id="pokemonGrid" class="pokemon-grid"></div>

        <div class="load-more-container">
            <button id="loadMoreBtn" class="load-more-btn">Cargar más Pokémon</button>
        </div>
    </div>

    <!-- Modal para detalles del Pokémon -->
    <div id="pokemonModal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modalBody" class="modal-body">
                <!-- Contenido dinámico -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
